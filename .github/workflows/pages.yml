name: Website

# Publishes site/ (plus the README screenshots, icon and llms.txt) to GitHub Pages at
# https://phil288.github.io/git-client/. One-time setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: [site/**, docs/images/**, llms.txt, build/icon.png, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp site/index.html site/robots.txt site/sitemap.xml site/og.png _site/
          cp docs/images/*.png _site/images/
          cp build/icon.png llms.txt _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
