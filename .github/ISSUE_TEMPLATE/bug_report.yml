name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repository with …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Git Console output
      description: View → Git Console (Alt+9). Paste the relevant commands and stderr (remove anything private).
      render: text
  - type: input
    id: version
    attributes:
      label: GitClient version
      description: Help → About GitClient
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Ubuntu 24.04, Ubuntu 22.04, Other Linux, Windows 11, Windows 10]
    validations:
      required: true
  - type: input
    id: git
    attributes:
      label: git --version
